name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Run the tests
        run: python3 -m unittest discover -s tests -v
      - name: Check the settings example reads
        run: python3 -c "import koovi; print(koovi.parse_yaml(open('config.example.yaml').read())['assistant'])"
      - name: Build the screen light helper
        run: |
          xcrun swiftc -O -target arm64-apple-macos12 -o /tmp/koovi-light light/KooviLight.swift
          test -x /tmp/koovi-light
